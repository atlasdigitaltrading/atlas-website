<!doctype html>
<!--
  Source for public/og/og-home-v4.png (1200x630), the home share card.
  Render with: node scripts/render-og-home.mjs
  Same brand as v3; headline changed 2026-11 to "for Institutional Trading".
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #09090b; }
  body {
    position: relative; font-family: "DM Sans", system-ui, sans-serif; color: #f1f5f9;
    background:
      radial-gradient(ellipse 60% 70% at 18% 40%, rgba(59,130,246,0.14) 0%, transparent 60%),
      linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px),
      #09090b;
    background-size: auto, 56px 56px, 56px 56px, auto;
  }
  .brand { position: absolute; left: 64px; top: 56px; display: flex; align-items: center; gap: 14px; }
  .brand span { font-family: "Instrument Sans", sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.22em; color: #f1f5f9; }
  .copy { position: absolute; left: 64px; top: 158px; width: 600px; }
  h1 { font-family: "Instrument Sans", sans-serif; font-weight: 700; letter-spacing: -0.03em; line-height: 0.98; }
  h1 .l1, h1 .l2 { display: block; font-size: 78px; }
  h1 .l2 { color: #3b82f6; }
  h1 .l3 { display: block; margin-top: 10px; font-size: 46px; font-weight: 600; letter-spacing: -0.02em; color: #f1f5f9; }
  .sub { margin-top: 26px; font-size: 22px; line-height: 1.35; color: #94a3b8; }
  .sides { margin-top: 8px; font-size: 21px; font-weight: 700; color: #e2e8f0; }
  .chips { position: absolute; left: 64px; bottom: 86px; display: flex; gap: 10px; }
  .chip { font-family: "Instrument Sans", sans-serif; font-weight: 600; font-size: 15px; padding: 9px 16px; border-radius: 9px; border: 1.5px solid; }
  .chip.x { color: #60a5fa; border-color: rgba(96,165,250,0.55); }
  .chip.d { color: #22d3ee; border-color: rgba(34,211,238,0.55); }
  .chip.t { color: #a78bfa; border-color: rgba(167,139,250,0.55); }
  .chip.i { color: #4ade80; border-color: rgba(74,222,128,0.55); }
  .domain { position: absolute; left: 64px; bottom: 48px; font-family: "Instrument Sans", sans-serif; font-weight: 700; font-size: 17px; color: #3b82f6; }
  .shots { position: absolute; left: 690px; top: 70px; width: 560px; height: 560px; perspective: 1600px; }
  .shot { position: absolute; border-radius: 10px; border: 1px solid #27272a; overflow: hidden; background: #0f0f12;
          box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(59,130,246,0.12); }
  .shot img { display: block; width: 100%; height: auto; }
  .shot.back { left: 140px; top: 20px; width: 520px; transform: rotateY(-14deg) rotateX(4deg); opacity: 0.85; }
  .shot.front { left: 0; top: 190px; width: 540px; transform: rotateY(-12deg) rotateX(3deg); }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #09090b 0%, rgba(9,9,11,0) 14%), linear-gradient(0deg, #09090b 0%, rgba(9,9,11,0) 12%); pointer-events: none; }
</style>
</head>
<body>
  <div class="shots">
    <div class="shot back"><img src="../public/screenshots/v2/desk-hero.png" alt="" /></div>
    <div class="shot front"><img src="../public/screenshots/trading.png" alt="" /></div>
  </div>
  <div class="fade"></div>

  <div class="brand">
    <svg width="42" height="42" viewBox="0 0 40 40" fill="none">
      <polygon points="20,2 38,34 2,34" fill="none" stroke="#3b82f6" stroke-width="2.5" />
      <polygon points="20,12 30,30 10,30" fill="#3b82f6" fill-opacity="0.2" />
      <line x1="20" y1="2" x2="20" y2="30" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5" />
    </svg>
    <span>ATLAS</span>
  </div>

  <div class="copy">
    <h1>
      <span class="l1">Execution</span>
      <span class="l2">Intelligence</span>
      <span class="l3">for Institutional Trading</span>
    </h1>
    <div class="sub">Equities, options and digital assets on one engine.</div>
    <div class="sides">Buy side · Sell side · Measurement · Infrastructure</div>
  </div>

  <div class="chips">
    <span class="chip x">AtlasX</span>
    <span class="chip d">Atlas DESK</span>
    <span class="chip t">Atlas TCA</span>
    <span class="chip i">Atlas Infrastructure</span>
  </div>
  <div class="domain">atlasdigitaltrading.com</div>
</body>
</html>
